<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sessions</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sessions">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --wash: #f5f5f2;
    --wash-2: #efefeb;
    --line: #e7e7e2;
    --ink: #18181b;
    --sub: #66666b;
    --faint: #a0a0a5;
    --shu: #d2452c;
    --shu-ink: #a8321c;
    --shu-wash: #fcefea;
    --ok: #2f7d5b;
    --sans: "IBM Plex Sans JP", -apple-system, "Hiragino Sans", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --side: 340px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.7 var(--sans); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .app { display: grid; grid-template-columns: var(--side) 1fr; height: 100dvh; }

  /* ---------- 一覧 ---------- */
  .side { min-width: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--paper); }
  .side-head { padding: calc(18px + env(safe-area-inset-top)) 20px 12px; display: flex; align-items: baseline; gap: 10px; }
  .side-head h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  .side-head .count { color: var(--faint); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .side-head .conn { margin-left: auto; font-size: 12px; color: var(--faint); }
  .side-head .conn.bad { color: var(--shu); }
  .side-head .spawn-btn { flex: none; font-size: 12px; color: var(--sub); padding: 3px 9px; border-radius: 999px; background: var(--wash); }
  .side-head .spawn-btn:hover { background: var(--wash-2); color: var(--ink); }
  .spawnform { margin: 0 12px 10px; padding: 10px; border-radius: 10px; background: var(--wash); display: grid; gap: 8px; }
  .spawnform[hidden] { display: none; }
  .spawnform select, .spawnform input { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; }
  .spawnform-row { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .spawnform-row button { padding: 5px 12px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 12px; }
  .spawnform-row button[type="button"] { background: none; color: var(--sub); }
  .spawnform-row .spawn-msg { color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stop { flex: none; font-size: 12px; color: var(--sub); padding: 4px 10px; border-radius: 999px; background: var(--wash); margin-right: 8px; }
  .stop.arm { color: var(--paper); background: var(--shu); }
  .hint-row { display: flex; align-items: baseline; gap: 12px; }
  .hint-row .hint { flex: 1; min-width: 0; }
  .as { flex: none; font-size: 12px; color: var(--faint); display: inline-flex; align-items: baseline; gap: 6px; }
  .as input { font: inherit; font-size: 12px; width: 9em; padding: 2px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
  #list { overflow-y: auto; flex: 1; padding: 0 8px calc(12px + env(safe-area-inset-bottom)); }
  .row { display: block; width: 100%; min-width: 0; overflow: hidden; text-align: left; padding: 12px 12px 13px; border-radius: 10px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 12px; right: 12px; border-top: 1px solid var(--line); }
  .row:hover { background: var(--wash); }
  .row:hover::before, .row:hover + .row::before, .row.on::before, .row.on + .row::before { border-color: transparent; }
  .row.on { background: var(--wash-2); }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; }
  .row .ttl { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .when { color: var(--faint); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .row .l2 { color: var(--faint); font-size: 12px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .l3 { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--sub); min-width: 0; overflow: hidden; padding-left: 1px; }
  .row .l3 .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .row .l3 .tool { font-family: var(--mono); font-size: 12px; color: var(--ink); flex: none; }
  .row.busy .l3 { color: var(--ink); }

  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; position: relative; }
  .busy .pulse, .pulse.busy { background: var(--shu); }
  .busy .pulse::after, .pulse.busy::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--shu); opacity: 0; animation: ring 1.8s ease-out infinite; }
  @keyframes ring { 0% { transform: scale(.4); opacity: .7; } 100% { transform: scale(1.4); opacity: 0; } }

  .row .mach { color: var(--sub); }
  .row .rel { color: var(--sub); font-weight: 500; }
  #h-sub a { color: inherit; text-decoration: underline dotted; }
  .down { margin: 0 12px 8px; padding: 8px 12px; border-radius: 8px; background: var(--shu-wash); color: var(--shu-ink); font-size: 12.5px; }
  .empty { color: var(--faint); font-size: 14px; padding: 28px 16px; line-height: 1.8; }

  /* ---------- 会話 ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .chat-head { display: flex; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top)) 24px 12px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); backdrop-filter: blur(8px); position: relative; z-index: 2; }
  .back { display: none; width: 34px; height: 34px; margin-left: -8px; border-radius: 8px; align-items: center; justify-content: center; }
  .back:hover { background: var(--wash); }
  .head-main { min-width: 0; flex: 1; }
  .head-title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head-sub { color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { flex: none; display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--sub); padding: 4px 10px 4px 9px; border-radius: 999px; background: var(--wash); }
  .state.busy { color: var(--shu-ink); background: var(--shu-wash); }
  .state.gone { color: var(--faint); }

  #scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  #feed { max-width: 760px; margin: 0 auto; padding: 20px 24px 28px; }
  .more { display: block; margin: 0 auto 18px; font-size: 13px; color: var(--sub); padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); }
  .more:hover { background: var(--wash); }

  .msg { margin: 0 0 18px; }
  .say { word-break: break-word; }
  .say p { margin: 0 0 .7em; } .say p:last-child { margin-bottom: 0; }
  .say h1, .say h2, .say h3, .say h4 { font-size: 15px; font-weight: 600; margin: 1.1em 0 .4em; }
  .say ul, .say ol { margin: 0 0 .7em; padding-left: 1.4em; } .say li { margin: .15em 0; }
  .say code { font-family: var(--mono); font-size: .88em; background: var(--wash); padding: .1em .35em; border-radius: 4px; }
  .say pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; background: var(--wash); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0 0 .8em; }
  .say pre code { background: none; padding: 0; font-size: inherit; }
  .say a { color: var(--shu-ink); text-underline-offset: 2px; }
  .say blockquote { margin: 0 0 .7em; padding-left: 12px; border-left: 2px solid var(--line); color: var(--sub); }
  .say .tbl { overflow-x: auto; margin: 0 0 .8em; }
  .say table { border-collapse: collapse; font-size: 13.5px; }
  .say th, .say td { border-bottom: 1px solid var(--line); padding: 6px 12px 6px 0; text-align: left; vertical-align: top; }
  .say th { font-weight: 600; color: var(--sub); font-size: 12.5px; }
  .say hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }

  .mine { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble { max-width: min(560px, 86%); padding: 9px 14px; border-radius: 16px 16px 4px 16px; background: var(--wash); white-space: pre-wrap; word-break: break-word; }
  .mine.inj .bubble { background: var(--shu-wash); color: var(--ink); box-shadow: inset 0 0 0 1px rgba(210,69,44,.18); }
  .meta { font-size: 11.5px; color: var(--faint); margin: 4px 4px 0; display: flex; gap: 6px; align-items: center; }
  .mine.inj .meta .tag { color: var(--shu-ink); }
  .mine.inj.agent .bubble { background: var(--wash-2); box-shadow: inset 0 0 0 1px var(--line); border: 1px dashed var(--faint); }
  .mine.inj.agent .meta .tag { color: var(--sub); }
  .meta .wait { color: var(--sub); }
  .meta .late { color: var(--shu); }
  .mine.sending .bubble { opacity: .6; }

  .acts { margin: -4px 0 18px; }
  .acts summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); padding: 3px 8px 3px 6px; margin-left: -6px; border-radius: 6px; max-width: 100%; }
  .acts summary::-webkit-details-marker { display: none; }
  .acts summary:hover { background: var(--wash); color: var(--sub); }
  .acts summary .chev { transition: transform .15s; flex: none; }
  .acts[open] summary .chev { transform: rotate(90deg); }
  .acts summary .names { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acts ol { list-style: none; margin: 4px 0 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); }
  .acts li { font-family: var(--mono); font-size: 12px; line-height: 1.55; color: var(--sub); padding: 3px 0 3px 10px; display: flex; gap: 10px; min-width: 0; }
  .acts li b { font-weight: 500; color: var(--ink); flex: none; }
  .acts li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  .note { text-align: center; font-size: 12px; color: var(--faint); margin: 4px auto 18px; max-width: 520px; line-height: 1.6; }
  .note.warn { color: var(--shu-ink); }

  /* いまの動き */
  .now { display: none; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; padding: 0 24px 8px; font-size: 13px; color: var(--sub); min-width: 0; overflow: hidden; }
  .now .pulse { margin-left: 2px; }
  .now.on { display: flex; }
  .now .t { font-family: var(--mono); font-size: 12px; color: var(--ink); flex: none; }
  .now .s { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* 入力 */
  .compose { border-top: 1px solid var(--line); padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); background: var(--paper); }
  .field { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: 22px; padding: 6px 6px 6px 16px; background: var(--paper); transition: border-color .15s, box-shadow .15s; }
  .field:focus-within { border-color: #cfcfca; box-shadow: 0 0 0 4px var(--wash); }
  .field.busy:focus-within { border-color: rgba(210,69,44,.45); box-shadow: 0 0 0 4px var(--shu-wash); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; line-height: 1.6; padding: 6px 0; max-height: 40vh; background: transparent; color: var(--ink); }
  textarea::placeholder { color: var(--faint); }
  .send { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; transition: opacity .15s, background .15s; }
  .field.busy .send { background: var(--shu); }
  .send:disabled { opacity: .25; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; color: var(--faint); padding: 0 16px; }

  .blank { flex: 1; display: grid; place-items: center; color: var(--faint); font-size: 14px; text-align: center; padding: 24px; line-height: 1.9; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side, .chat { grid-area: 1 / 1; }
    .app.view-chat .side { display: none; }
    .app.view-list .chat { display: none; }
    .side { border-right: 0; }
    .back { display: inline-flex; }
    .chat-head, .compose { padding-left: 16px; padding-right: 16px; }
    #feed { padding: 16px 16px 24px; }
    .now { padding: 0 16px 8px; }
    .hint { padding: 0 12px; }
    #list { padding: 0 4px calc(12px + env(safe-area-inset-bottom)); }
    .side-head { padding-left: 16px; padding-right: 16px; }
    textarea { font-size: 16px; } /* iOS のズーム防止 */
  }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none !important; } }
</style>
</head>
<body>
<div class="app view-list" id="app">
  <aside class="side">
    <div class="side-head"><h1>セッション</h1><span class="count" id="count"></span><span class="conn" id="conn"></span><button class="spawn-btn" id="spawn-btn" type="button">＋ 子を立てる</button></div>
    <form class="spawnform" id="spawnform" hidden>
      <select id="spawn-m" aria-label="マシン"></select>
      <input id="spawn-dir" placeholder="作業ディレクトリ（~/Documents/… か絶対パス）" autocomplete="off" spellcheck="false">
      <div class="spawnform-row"><button type="submit" id="spawn-go">立てる</button><button type="button" id="spawn-cancel">やめる</button><span class="spawn-msg" id="spawn-msg"></span></div>
    </form>
    <div id="list"></div>
  </aside>

  <section class="chat" id="chat">
    <div class="blank" id="blank">左からセッションを選ぶと、<br>会話の続きがここに流れます。</div>
    <template id="chat-tpl">
      <header class="chat-head">
        <button class="back" id="back" aria-label="一覧に戻る">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12.5 4.5 7 10l5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="head-main"><div class="head-title" id="h-title"></div><div class="head-sub" id="h-sub"></div></div>
        <button class="stop" id="h-stop" type="button" hidden>止める</button>
        <span class="state" id="h-state"><span class="pulse"></span><span id="h-state-t"></span></span>
      </header>
      <div id="scroll"><div id="feed"></div></div>
      <div class="now" id="now"><span class="pulse busy"></span><span class="t" id="now-t"></span><span class="s" id="now-s"></span></div>
      <form class="compose" id="form">
        <div class="field" id="field">
          <textarea id="input" rows="1"></textarea>
          <button class="send" id="send" type="submit" aria-label="送る" disabled>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="hint-row"><div class="hint" id="hint"></div><label class="as">名乗り <input id="as" placeholder="空なら本人" autocomplete="off" spellcheck="false" maxlength="64"></label></div>
      </form>
    </template>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const app = $("app");
const coarse = matchMedia("(pointer: coarse)").matches;

let sessions = [];
let machines = [];
let cur = null;          // { id, offset, start, hasMore, items[], pending[] }
let listHtml = "";

// ---------- 通信 ----------
async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "x-cc-inject": "1", "content-type": "application/json" } });
  if (res.redirected || res.type === "opaqueredirect") { location.reload(); throw new Error("再ログインが必要です"); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok && res.status !== 202) throw new Error(body.error || `${res.status}`);
  return body;
}

// ---------- 文字 ----------
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const home = (p) => p.replace(/^\/(Users|home)\/[^/]+/, "~");
const base = (p) => p.split("/").filter(Boolean).pop() || p;

function ago(ts) {
  if (!ts) return "";
  const t = typeof ts === "number" ? ts : Date.parse(ts);
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return "いま";
  if (s < 3600) return `${Math.round(s / 60)}分前`;
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" });
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
// mcp__claude-in-chrome__browser_batch → chrome browser_batch
const tname = (n) => {
  const m = String(n).match(/^mcp__(.+?)__(.+)$/);
  if (!m) return n;
  const srv = m[1].replace(/^(plugin_[^_]+_|claude_ai_|claude-in-)/, "");
  return `${srv} ${m[2]}`;
};
const clock = (ts) => ts ? new Date(ts).toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" }) : "";

// 小さな Markdown。先に全部エスケープしてから、決まった形だけタグに戻す
function md(src) {
  const blocks = [];
  let s = String(src).replace(/```[^\n]*\n([\s\S]*?)```/g, (_, code) => {
    blocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
    return `\u0000${blocks.length - 1}\u0000`;
  });
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out = [];
  const lines = s.split("\n");
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const ph = l.match(/^\u0000(\d+)\u0000$/);
    if (ph) { out.push(blocks[+ph[1]]); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)) {
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(lines[i++]);
      i--;
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      const [h, ...rest] = body;
      out.push(`<div class="tbl"><table><thead><tr>${cells(h).map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rest.map((r) => `<tr>${cells(r).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      i--;
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if (/^\s*>\s?/.test(l)) { out.push(`<blockquote>${inline(l.replace(/^\s*>\s?/, ""))}</blockquote>`); continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push("<hr>"); continue; }
    if (!l.trim()) { out.push(""); continue; }
    // 連続する行はひとつの段落にまとめる
    const para = [l];
    while (i + 1 < lines.length && lines[i + 1].trim() && !/^(\s*([-*]|\d+\.)\s+|#{1,4}\s|\s*\||\s*>|\u0000)/.test(lines[i + 1])) para.push(lines[++i]);
    out.push(`<p>${para.map(inline).join("<br>")}</p>`);
  }
  return out.join("\n");
}

// ---------- 一覧 ----------
function activity(s) {
  const l = s.last;
  if (!l) return `<span class="txt">まだ動きがない</span>`;
  if (l.kind === "tool") return `<span class="tool">${esc(tname(l.name))}</span><span class="txt">${esc(l.summary)}</span>`;
  const who = l.kind === "assistant" ? "" : l.kind === "injected" ? "割り込み: " : "あなた: ";
  return `<span class="txt">${esc(who + String(l.text).replace(/\s+/g, " "))}</span>`;
}

// 親子の関係。子の transcript に残る「from agent:<マシン>/<sessionId 先頭8文字>/<役割>」から親をたどる
function parentOf(s) {
  const p = s.parent;
  if (!p) return null;
  const found = p.sessionIdPrefix ? sessions.find((x) => x.sessionId.startsWith(p.sessionIdPrefix) && (!p.machine || x.machine === p.machine)) : null;
  return { session: found || null, label: p.label, machine: p.machine };
}
function childrenOf(s) {
  return sessions.filter((x) => x.parent && x.parent.sessionIdPrefix && s.sessionId.startsWith(x.parent.sessionIdPrefix) && (!x.parent.machine || x.parent.machine === s.machine));
}
function relChips(s) {
  const out = [];
  const p = parentOf(s);
  if (p) out.push(`<span class="rel">↳ 親 ${esc(p.session ? (p.session.title || p.session.name || p.session.sessionId.slice(0, 8)) : `${p.machine || ""}/${p.label}`)}</span>`);
  const kids = childrenOf(s);
  if (kids.length) out.push(`<span class="rel">子 ${kids.length}</span>`);
  return out.length ? ` · ${out.join(" · ")}` : "";
}
function renderList() {
  const busy = sessions.filter((s) => s.status === "busy").length;
  $("count").textContent = sessions.length ? `${sessions.length}件${busy ? ` · ${busy}件が作業中` : ""}` : "";
  const html = sessions.map((s) => `
    <button class="row ${s.status === "busy" ? "busy" : ""} ${cur && cur.id === s.sessionId ? "on" : ""}" data-id="${s.sessionId}">
      <div class="l1"><span class="ttl">${esc(s.title || s.name || s.sessionId.slice(0, 8))}</span><span class="when">${esc(ago(s.lastAt || s.startedAt))}</span></div>
      <div class="l2">${machines.length > 1 ? `<span class="mach">${esc(s.machine)}</span> · ` : ""}${esc(base(s.cwd))}${s.kind === "background" ? " · バックグラウンド" : ""}${s.hasSocket ? "" : " · 送信できない"}${relChips(s)}</div>
      <div class="l3"><span class="pulse"></span>${activity(s)}</div>
    </button>`).join("") || `<div class="empty">いま動いているセッションはありません。<br>ターミナルで claude を起動すると、ここに出ます。</div>`;
  const down = machines.filter((m) => !m.ok).map((m) => `<div class="down">${esc(m.name)} につながっていない</div>`).join("");
  const all = down + html;
  if (all !== listHtml) { $("list").innerHTML = all; listHtml = all; }
}

$("list").addEventListener("click", (e) => {
  const row = e.target.closest(".row");
  if (row) location.hash = `#/s/${row.dataset.id}`;
});

async function loadSessions() {
  try {
    const r = await api("/api/sessions");
    sessions = r.sessions; machines = r.machines || [];
    $("conn").textContent = ""; $("conn").className = "conn";
    if ($("spawn-m")) fillSpawnMachines();
  } catch (e) {
    // Access のログインが切れると fetch がリダイレクトで失敗する。押せば読み直してログインし直せる
    $("conn").innerHTML = `<button type="button" onclick="location.reload()">つながっていない · 再読み込み</button>`; $("conn").className = "conn bad";
    return;
  }
  renderList();
  if (cur) renderHead();
}

// ---------- 会話 ----------
function openChat(id) {
  if (cur && cur.id === id) return;
  cur = { id, machine: sessions.find((s) => s.sessionId === id)?.machine, offset: null, start: null, hasMore: false, items: [], pending: [], loaded: false };
  $("blank")?.remove();
  const chat = $("chat");
  chat.querySelectorAll(":scope > :not(template)").forEach((n) => n.remove());
  chat.appendChild($("chat-tpl").content.cloneNode(true));
  $("back").onclick = () => { location.hash = ""; };
  $("feed").innerHTML = `<div class="note">読み込み中…</div>`;
  wireComposer();
  app.className = "app view-chat";
  renderList(); renderHead(); poll();
}

function closeChat() {
  cur = null;
  app.className = "app view-list";
  const chat = $("chat");
  chat.querySelectorAll(":scope > :not(template)").forEach((n) => n.remove());
  const b = document.createElement("div");
  b.className = "blank"; b.id = "blank";
  b.innerHTML = "左からセッションを選ぶと、<br>会話の続きがここに流れます。";
  chat.prepend(b);
  renderList();
}

function current() { return cur && sessions.find((s) => s.sessionId === cur.id); }
// どのマシンのセッションかを API に伝える
function q(extra = {}) {
  const p = new URLSearchParams({ ...(cur && cur.machine ? { m: cur.machine } : {}), ...extra });
  return p.size ? `?${p}` : "";
}

function renderHead() {
  const s = current();
  if (!$("h-title")) return;
  const st = $("h-state");
  if (!s) {
    $("h-title").textContent = cur.title || "終了したセッション";
    $("h-sub").textContent = "このセッションは終了しました";
    st.className = "state gone"; $("h-state-t").textContent = "終了";
    $("h-stop").hidden = true;
    $("input").disabled = true; $("input").placeholder = "終了したセッションには送れません";
    $("now").classList.remove("on");
    syncSend();
    return;
  }
  cur.title = s.title || s.name || cur.title;
  $("h-title").textContent = cur.title || s.sessionId;
  $("h-stop").hidden = !(s.spawned || parentOf(s));
  const p = parentOf(s);
  const kids = childrenOf(s);
  const link = (x) => `<a href="#/s/${x.sessionId}">${esc(x.title || x.name || x.sessionId.slice(0, 8))}</a>`;
  $("h-sub").innerHTML = esc((machines.length > 1 ? `${s.machine} · ` : "") + home(s.cwd))
    + (p ? ` · 親: ${p.session ? link(p.session) : esc(`${p.machine || ""}/${p.label}`)}` : "")
    + (kids.length ? ` · 子: ${kids.map(link).join("、")}` : "");
  const busy = s.status === "busy";
  st.className = "state" + (busy ? " busy" : "");
  $("h-state-t").textContent = busy ? "作業中" : "待機中";
  $("field").classList.toggle("busy", busy);
  $("hint").textContent = busy ? "ツールの合間に届きます。/コマンドと権限の承認は使えません" : "送ると新しいターンが始まります。/コマンドと権限の承認は使えません";
  $("input").disabled = !s.hasSocket;
  $("input").placeholder = !s.hasSocket ? "このセッションには送れません"
    : busy ? "作業に割り込む" : "次の指示を送る";
  // いまの動き
  const now = $("now");
  if (busy && s.last && s.last.kind === "tool") {
    $("now-t").textContent = tname(s.last.name); $("now-s").textContent = s.last.summary;
    now.classList.add("on");
  } else if (busy) {
    $("now-t").textContent = ""; $("now-s").textContent = "考えています…";
    now.classList.add("on");
  } else now.classList.remove("on");
  syncSend();
}

// 連続したツール呼び出しはひとまとめにする
function group(items) {
  const out = [];
  for (const it of items) {
    const last = out[out.length - 1];
    if (it.kind === "tool" && last && last.kind === "acts") last.tools.push(it);
    else if (it.kind === "tool") out.push({ kind: "acts", tools: [it], ts: it.ts });
    else out.push(it);
  }
  return out;
}

const chev = `<svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M3.5 2 6.5 5l-3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderItem(g) {
  if (g.kind === "assistant") return `<div class="msg say">${md(g.text)}</div>`;
  if (g.kind === "user") return `<div class="msg mine"><div class="bubble">${esc(g.text)}</div><div class="meta"><span>${g.via === "queued" ? "ターミナルから（作業中に入力）" : "ターミナルから"}</span><span>${clock(g.ts)}</span></div></div>`;
  if (g.kind === "injected") {
    // 親エージェント（from が agent: で始まる）は人の割り込みと見た目で分ける
    const agent = typeof g.from === "string" && g.from.startsWith("agent:") ? g.from.slice(6) : null;
    const src = agent ? `親エージェント ${agent} から` : g.via === "web" ? `${g.host || "ハブ"} から` : g.via === "local" ? "ローカルの画面から" : "送り主不明";
    return `<div class="msg mine inj${agent ? " agent" : ""}"><div class="bubble">${esc(g.text)}</div><div class="meta"><span class="tag">${agent ? "割り込み（エージェント）" : "割り込み"}</span><span>${esc(src)} · 届いた ${clock(g.ts)}</span></div></div>`;
  }
  if (g.kind === "notice") return `<div class="note ${g.tone === "warn" ? "warn" : ""}">${esc(g.text)}</div>`;
  if (g.kind === "acts") {
    const names = [...new Set(g.tools.map((t) => tname(t.name)))];
    const lastT = g.tools[g.tools.length - 1];
    const label = g.tools.length === 1 ? `${tname(lastT.name)}  ${lastT.summary}` : `${g.tools.length}回の操作 · ${names.slice(0, 4).join(", ")}${names.length > 4 ? " ほか" : ""}`;
    return `<details class="acts"><summary>${chev}<span class="names">${esc(label)}</span></summary><ol>${g.tools.map((t) => `<li><b>${esc(tname(t.name))}</b><span title="${esc(t.summary)}">${esc(t.summary)}</span></li>`).join("")}</ol></details>`;
  }
  return "";
}

function renderFeed(keepFromBottom) {
  const sc = $("scroll"), feed = $("feed");
  const fromBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
  const open = new Set([...feed.querySelectorAll("details.acts[open]")].map((d) => d.dataset.k));
  let html = cur.hasMore ? `<button class="more" id="more" type="button">前の会話を読み込む</button>` : "";
  const groups = group(cur.items);
  html += groups.map((g, i) => renderItem(g).replace('<details class="acts"', `<details class="acts" data-k="${i}"${open.has(String(i)) ? " open" : ""}`)).join("");
  html += cur.pending.map((p) => `<div class="msg mine inj ${p.state === "sending" ? "sending" : ""}"><div class="bubble">${esc(p.text)}</div><div class="meta"><span class="tag">割り込み</span>${p.state === "sending" ? `<span class="wait">送信中…</span>` : p.state === "failed" ? `<span class="late">送れなかった: ${esc(p.error)}</span>` : Date.now() - p.at > 30000 ? `<span class="late">まだ届いていない</span>` : `<span class="wait">届くのを待っている…</span>`}</div></div>`).join("");
  if (!html) html = `<div class="note">まだ会話がありません</div>`;
  feed.innerHTML = html;
  if ($("more")) $("more").onclick = loadOlder;
  if (keepFromBottom !== undefined) sc.scrollTop = sc.scrollHeight - sc.clientHeight - keepFromBottom;
  else if (fromBottom < 120 || !cur.loaded) sc.scrollTop = sc.scrollHeight;
}

let polling = false;
async function poll() {
  if (!cur || polling) return; // 前の読み込みが終わる前に次を始めると、同じ範囲を2回つないでしまう
  polling = true;
  const id = cur.id, from = cur.offset;
  try {
    const r = await api(`/api/sessions/${id}/messages` + q(from === null ? {} : { offset: from }));
    if (!cur || cur.id !== id || cur.offset !== from) return;
    if (cur.offset === null) { cur.start = r.start; cur.hasMore = r.hasMore; }
    cur.offset = r.offset;
    if (r.title) cur.title = r.title;
    let changed = r.items.length > 0 || !cur.loaded;
    for (const it of r.items) {
      if (it.kind === "injected") {
        const i = cur.pending.findIndex((p) => p.text.trim() === it.text.trim());
        if (i >= 0) cur.pending.splice(i, 1);
      }
      cur.items.push(it);
    }
    if (cur.pending.some((p) => p.state === "waiting" && Date.now() - p.at > 30000 && !p.lateShown)) {
      cur.pending.forEach((p) => { if (Date.now() - p.at > 30000) p.lateShown = true; });
      changed = true;
    }
    if (changed) { renderFeed(); cur.loaded = true; }
  } catch (e) {
    // 立ち上げ直後の子は transcript がまだ無い。最初の文が届くまで静かに待つ
    if (cur && !cur.loaded) $("feed").innerHTML = /transcript not found/.test(e.message) ? `<div class="note">まだ会話がありません。文を送ると始まります</div>` : `<div class="note warn">${esc(e.message)}</div>`;
  } finally {
    polling = false;
  }
}

async function loadOlder() {
  if (!cur || !cur.hasMore) return;
  const btn = $("more"); if (btn) { btn.disabled = true; btn.textContent = "読み込み中…"; }
  const sc = $("scroll");
  const fromBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
  const r = await api(`/api/sessions/${cur.id}/messages` + q({ before: cur.start }));
  cur.items = [...r.items, ...cur.items];
  cur.start = r.start; cur.hasMore = r.hasMore;
  renderFeed(fromBottom);
}

// ---------- 入力 ----------
function syncSend() {
  const i = $("input"); if (!i) return;
  $("send").disabled = i.disabled || !i.value.trim();
}

function wireComposer() {
  const i = $("input");
  const fit = () => { i.style.height = "auto"; i.style.height = Math.min(i.scrollHeight, innerHeight * 0.4) + "px"; };
  i.addEventListener("input", () => { fit(); syncSend(); });
  i.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !coarse) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const text = i.value.trim();
    if (!text || !cur || i.disabled) return;
    const p = { text, state: "sending", at: Date.now() };
    cur.pending.push(p);
    i.value = ""; fit(); syncSend();
    renderFeed(); $("scroll").scrollTop = $("scroll").scrollHeight;
    try {
      const as = ($("as").value || "").trim();
      await api(`/api/sessions/${cur.id}/send` + q(), { method: "POST", body: JSON.stringify(as ? { text, as } : { text }) });
      p.state = "waiting"; p.at = Date.now();
    } catch (err) {
      p.state = "failed"; p.error = err.message;
    }
    renderFeed();
  };
  // 名乗りは端末ごとに覚える（Muse などのエージェントが画面から送るとき用。空なら本人として送る）
  try { $("as").value = localStorage.getItem("as") || ""; } catch {}
  $("as").addEventListener("input", () => { try { localStorage.setItem("as", $("as").value.trim()); } catch {} });
  // 止める。2回押しで実行する
  const stopBtn = $("h-stop");
  let armed = 0;
  stopBtn.onclick = async () => {
    if (!cur) return;
    if (!armed) { armed = setTimeout(() => { armed = 0; stopBtn.classList.remove("arm"); stopBtn.textContent = "止める"; }, 4000); stopBtn.classList.add("arm"); stopBtn.textContent = "本当に止める"; return; }
    clearTimeout(armed); armed = 0; stopBtn.classList.remove("arm"); stopBtn.textContent = "止めています…"; stopBtn.disabled = true;
    try { await api(`/api/sessions/${cur.id}/stop` + q(), { method: "POST" }); } catch (err) { stopBtn.textContent = `止められない: ${err.message}`; stopBtn.disabled = false; return; }
    stopBtn.disabled = false; stopBtn.textContent = "止める";
    setTimeout(loadSessions, 1500);
  };
  if (!coarse) setTimeout(() => i.focus(), 0);
}

// 子を立てる先のマシン。一覧を読むたびに入れ直し、選んでいたものは残す
function fillSpawnMachines() {
  const sel = $("spawn-m");
  const keep = sel.value;
  const names = machines.filter((m) => m.ok).map((m) => m.name);
  sel.innerHTML = names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("") || `<option value="">（マシンがありません）</option>`;
  if (names.includes(keep)) sel.value = keep;
}

// 子を立てる。ノードが tmux で claude を起動し、一覧に出たら開く
function wireSpawn() {
  const form = $("spawnform"), btn = $("spawn-btn"), msg = $("spawn-msg");
  btn.onclick = () => {
    fillSpawnMachines();
    form.hidden = !form.hidden;
    if (!form.hidden) $("spawn-dir").focus();
  };
  $("spawn-cancel").onclick = () => { form.hidden = true; msg.textContent = ""; };
  form.onsubmit = async (e) => {
    e.preventDefault();
    const m = $("spawn-m").value, dir = $("spawn-dir").value.trim();
    if (!m || !dir) return;
    $("spawn-go").disabled = true; msg.textContent = "立てています…";
    try {
      const r = await api(`/api/sessions/spawn?m=${encodeURIComponent(m)}`, { method: "POST", body: JSON.stringify({ dir }) });
      msg.textContent = `${r.tmux} を起動。一覧に出るのを待っています…`;
      for (let i = 0; i < 20; i++) {
        await new Promise((res) => setTimeout(res, 2000));
        await loadSessions();
        const s = sessions.find((x) => x.machine === r.machine && x.cwd === r.cwd);
        if (s) { form.hidden = true; msg.textContent = ""; $("spawn-dir").value = ""; location.hash = `#/s/${s.sessionId}`; break; }
        if (i === 19) msg.textContent = "一覧に出てきません。マシン側で tmux を見てください";
      }
    } catch (err) {
      msg.textContent = `立てられない: ${err.message}`;
    }
    $("spawn-go").disabled = false;
  };
}

// ---------- 画面の切り替え ----------
function route() {
  const m = location.hash.match(/^#\/s\/([0-9a-f-]{36})$/);
  if (m) openChat(m[1]); else if (cur) closeChat();
}
addEventListener("hashchange", route);

(async () => {
  // 子を立てる欄は一覧側にあるので、会話を開かなくても動くように最初に配線する
  wireSpawn();
  await loadSessions();
  route();
  // 広い画面で何も選んでいなければ、作業中のものか先頭を開く
  if (!cur && innerWidth > 860 && sessions[0]) location.hash = `#/s/${sessions[0].sessionId}`;
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
// アプリに戻ってきたらすぐ最新にする
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadSessions(); poll(); } });
setInterval(loadSessions, 3000);
setInterval(poll, 1500);
setInterval(() => { if (!document.hidden) renderList(); }, 30000);
</script>
</body>
</html>
